name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-content-parity:
    name: SharedContent parity (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-platform parity check
        run: python3 tests/shared-content-parity.py

  android-build-and-test:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    needs: shared-content-parity
    steps:
      - uses: actions/checkout@v4

      # JDK 17 builds/runs the app (compileOptions/kotlin toolchain); JDK 21 is
      # also installed because Robolectric requires Java 21+ to sandbox
      # Android 16 (API 36) in unit tests (see app/build.gradle.kts test task
      # javaLauncher). actions/setup-java exposes both via JAVA_HOME_<major>_X64
      # env vars, which Gradle's toolchain auto-detection picks up.
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run JVM unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
