name: CatholicSaints
options:
  bundleIdPrefix: com.jorgebalderas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "14"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_FILE: CatholicSaints/Resources/Info.plist
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    INFOPLIST_KEY_CFBundleDisplayName: "Confirmation Saints"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    SWIFT_EMIT_LOC_STRINGS: true
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    STRING_CATALOG_GENERATE_SYMBOLS: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G98XX4494X
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CatholicSaints:
    type: application
    platform: iOS
    sources:
      - path: CatholicSaints
        excludes:
          - "Resources/Preview Content"
      - path: ../SharedContent
        buildPhase: resources
        type: folder
    resources:
      - path: CatholicSaints/Resources/Assets.xcassets
      - path: CatholicSaints/Resources/Localizable.xcstrings
      - path: CatholicSaints/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jorgebalderas.ConfirmationSaints
        PRODUCT_NAME: "Confirmation Saints"
        PRODUCT_MODULE_NAME: CatholicSaints
        DEVELOPMENT_ASSET_PATHS: "\"CatholicSaints/Resources/Preview Content\""
    scheme:
      testTargets:
        - CatholicSaintsTests

  CatholicSaintsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CatholicSaintsTests
    dependencies:
      - target: CatholicSaints
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.jorgebalderas.ConfirmationSaints.Tests
        PRODUCT_NAME: "CatholicSaintsTests"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Confirmation Saints.app/Confirmation Saints"
